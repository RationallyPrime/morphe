[project]
name = "morphe-grammar"
version = "0.12.0"
description = "Pydantic v2 mirror of the Morphe Node grammar."
requires-python = ">=3.12"
dependencies = [
	"cryptography>=49.0.0",
	"jsonschema>=4.26.0",
	"pydantic>=2.12.0",
	"rfc8785>=0.1.4",
]

[project.optional-dependencies]
service = [
	"fastapi>=0.124.0",
	"fastapi-mcp>=0.1.0",
	"httpx>=0.28.0",
	"pydantic-ai-slim[openai]>=1.0.0",
	"pydantic-settings>=2.12.0",
	"uvicorn>=0.38.0",
]

# ruff/ty are deliberately NOT dev dependencies: weave-doctrine's mise.toml is
# the one version authority for the toolchain — hooks, Justfile, and seats call
# the bare binaries off PATH.
[dependency-groups]
dev = [
	"hypothesis>=6.155.7",
	"pytest>=8.4.0",
]

[tool.uv]
package = true

[tool.uv.sources]
morphe-grammar = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "py"
module-name = ["morphe_grammar", "morphe_agent", "morphe_cms", "morphe_contracts", "morphe_surface"]

[tool.pytest.ini_options]
testpaths = ["py/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["py"]
# weave-doctrine owns .github/scripts/review_loop.py. A copy this repo
# reformats is no longer a copy, and re-adopting an updated template must stay a
# straight file copy — so the lint gate leaves it alone (the CI step runs bare
# `ruff check` at the repo root, which would otherwise reach it).
exclude = [".github/scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
	"COM812",
	"D100",
	"D101",
	"D102",
	"D103",
	"D104",
	"D105",
	"D107",
	"ISC001",
	"N815",
	"S101",
	# Left preview in ruff 0.16 (96 hits, every py/ file). A repo-wide license
	# header is a deliberate policy pass, not a tool-bump concern.
	"CPY001",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates field annotations at runtime (model_rebuild), so imports used in a
# model's annotations are runtime-required and must NOT move into a TYPE_CHECKING block.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "morphe_contracts.ContractModel"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"

[tool.ty.src]
include = [
	"py/morphe_grammar",
	"py/morphe_agent",
	"py/morphe_cms",
	"py/morphe_contracts",
	"py/morphe_surface",
	"py/tests",
]
